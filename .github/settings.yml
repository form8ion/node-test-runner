_extends: .github
repository:
  name: node-test-runner
  description: form8ion plugin for the node.js test runner
  private: false
  homepage: https://npm.im/@form8ion/node-test-runner
branches:
  - name: master
    protection: null
rulesets:
  - name: prevent destruction of the default branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
